<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Memorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="phone-shell">

  <header class="app-header" style="background:linear-gradient(180deg, var(--maroon) 0%, var(--maroon-dark) 100%);">
      <div class="imgheader">
        <a href="index.html" aria-label="Ir al inicio"><img src="imagenes/LogoBeisbARLetrasrz.png" alt="BéisbAR MX"></a>
      </div>
  </header>

  <main class="app-main" style="background:linear-gradient(180deg, #ff8fae 0%, #9f2f4e 90%); margin:0; padding-top:30px;">
    <p class="memorama-timer" id="reloj">00:30</p>

    <!-- Se llena desde JavaScript -->
    <div class="memory-grid" id="tablero"></div>
  </main>

  <footer class="footer-bar">
    <a href="index.html">Inicio</a>
  </footer>

  <!-- Cuenta regresiva -->
  <div class="memorama-overlay" id="overlayCuenta">
    <p class="memorama-overlay-texto">Prepárate</p>
    <p class="memorama-cuenta" id="numeroCuenta">3</p>
  </div>

  <!-- Resultado -->
  <div class="memorama-overlay oculto" id="overlayFinal">
    <p class="memorama-overlay-titulo" id="tituloFinal">¡Ganaste!</p>
    <p class="memorama-overlay-texto" id="textoFinal">Completaste el memorama.</p>

    <div class="premio" id="premio" style="display:none;">
      <img id="premioImg" alt="">
      <p class="premio-nombre" id="premioNombre"></p>
      <p class="premio-estado">¡Carta nueva para tu colección!</p>
      <a href="coleccion.html" class="premio-link">Ver mi colección</a>
    </div>

    <div class="repetidas-indicador memorama-saldo" id="saldoFinal"></div>

    <div class="memorama-overlay-botones">
      <button type="button" class="memorama-btn" id="btnReintentar">Jugar de nuevo</button>
      <a href="memorama.html" class="memorama-btn memorama-btn--suave">Salir</a>
    </div>
  </div>

</div>

<script src="js/cartas.js"></script>
<script>
(function () {
  var JUGADORES = [
    'cade_gotta', 'hector_espino', 'justin_turner', 'martin_dihigo',
    'oliver_perez', 'ramiro_cuevas', 'ramiro_pena', 'roenis_elias'
  ];
  var RUTA      = 'imagenes/Memorama/';
  var REVERSO   = 'imagenes/Memorama/LogoReversoCartasP.png';
  var SEGUNDOS  = 30;    // en segundos
  var CUENTA    = 3;     // en segundos
  var ESPERA    = 900;   // en milisegundos

  var primeraCarta     = null;
  var segundaCarta     = null;
  var bloqueado        = true;
  var paresEncontrados = 0;
  var tiempoRestante   = SEGUNDOS;
  var intervaloReloj   = null;
  var intervaloCuenta  = null;

  var tablero        = document.getElementById('tablero');
  var reloj          = document.getElementById('reloj');
  var overlayCuenta  = document.getElementById('overlayCuenta');
  var numeroCuenta   = document.getElementById('numeroCuenta');
  var overlayFinal   = document.getElementById('overlayFinal');
  var tituloFinal    = document.getElementById('tituloFinal');
  var textoFinal     = document.getElementById('textoFinal');
  var premio         = document.getElementById('premio');
  var premioImg      = document.getElementById('premioImg');
  var premioNombre   = document.getElementById('premioNombre');
  var saldoFinal     = document.getElementById('saldoFinal');
  var btnReintentar  = document.getElementById('btnReintentar');

  // Revuelve una lista (Fisher-Yates)
  function barajar(lista) {
    for (var i = lista.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = lista[i];
      lista[i] = lista[j];
      lista[j] = temp;
    }
    return lista;
  }

  // Cada jugador va dos veces
 
  function construirTablero() {
    var mazo = barajar(JUGADORES.concat(JUGADORES));

    tablero.innerHTML = '';

    mazo.forEach(function (jugador) {
      var carta = document.createElement('button');
      carta.type = 'button';
      carta.className = 'memory-card';
      carta.dataset.jugador = jugador;
      carta.setAttribute('aria-label', 'Carta oculta');

      carta.innerHTML =
        '<div class="memory-card-inner">' +
          '<div class="memory-face memory-back"><img src="' + REVERSO + '" alt=""></div>' +
          '<div class="memory-face memory-front"><img src="' + RUTA + jugador + '.jpg" alt=""></div>' +
        '</div>';

      carta.addEventListener('click', function () { alVoltear(carta); });
      tablero.appendChild(carta);
    });
  }

  function alVoltear(carta) {
    if (bloqueado) return;
    if (carta === primeraCarta) return;
    if (carta.classList.contains('volteada')) return;
    if (carta.classList.contains('encontrada')) return;

    carta.classList.add('volteada');

    if (!primeraCarta) {
      primeraCarta = carta;
      return;
    }

    segundaCarta = carta;
    bloqueado = true;

    if (primeraCarta.dataset.jugador === segundaCarta.dataset.jugador) {
      acertar();
    } else {
      fallar();
    }
  }

  function acertar() {
    var a = primeraCarta;
    var b = segundaCarta;

    paresEncontrados++;

    setTimeout(function () {
      a.classList.add('encontrada');
      b.classList.add('encontrada');

      limpiarSeleccion();

      if (paresEncontrados === JUGADORES.length) {
        terminar(true);
      }
    }, 450);
  }

  function fallar() {
    var a = primeraCarta;
    var b = segundaCarta;

    setTimeout(function () {
      a.classList.remove('volteada');
      b.classList.remove('volteada');
      limpiarSeleccion();
    }, ESPERA);
  }

  function limpiarSeleccion() {
    primeraCarta = null;
    segundaCarta = null;
    bloqueado = false;
  }

  function pintarReloj() {
    var minutos = Math.floor(tiempoRestante / 60);
    var segundos = tiempoRestante % 60;
    reloj.textContent =
      (minutos < 10 ? '0' : '') + minutos + ':' +
      (segundos < 10 ? '0' : '') + segundos;
  }

  function arrancarReloj() {
    pintarReloj();
    intervaloReloj = setInterval(function () {
      tiempoRestante--;
      pintarReloj();

      if (tiempoRestante <= 10) reloj.classList.add('urgente');

      if (tiempoRestante <= 0) {
        terminar(false);
      }
    }, 1000);
  }

  function arrancarCuenta() {
    var restante = CUENTA;
    numeroCuenta.textContent = restante;

    intervaloCuenta = setInterval(function () {
      restante--;

      if (restante > 0) {
        numeroCuenta.textContent = restante;
        // Truco para reiniciar la animación
        numeroCuenta.classList.remove('late');
        void numeroCuenta.offsetWidth;
        numeroCuenta.classList.add('late');
      } else {
        clearInterval(intervaloCuenta);
        numeroCuenta.textContent = '¡Ya!';
        setTimeout(function () {
          overlayCuenta.classList.add('oculto');
          bloqueado = false;
          arrancarReloj();
        }, 500);
      }
    }, 1000);
  }

  function terminar(gano) {
    clearInterval(intervaloReloj);
    bloqueado = true;

    if (gano) {
      tituloFinal.textContent = '¡Ganaste!';
      overlayFinal.classList.add('es-victoria');

      // Al ganar, una carta que no tenga
      var ganada = Cartas.darNueva();

      if (ganada) {
        textoFinal.textContent = 'Completaste el memorama con ' + tiempoRestante + ' segundos de sobra.';
        premioImg.src = Cartas.rutaThumb(ganada.carta.id);
        premioImg.alt = ganada.carta.nombre;
        premioNombre.textContent = ganada.carta.nombre;
        premio.style.display = '';
      } else {
        textoFinal.textContent = 'Completaste el memorama con ' + tiempoRestante +
          ' segundos de sobra, y ya tienes la colección completa.';
        premio.style.display = 'none';
      }

    } else {
      tituloFinal.textContent = 'Se acabó el tiempo';
      textoFinal.textContent  = 'Te faltaron ' + (JUGADORES.length - paresEncontrados) + ' pares. Inténtalo de nuevo.';
      overlayFinal.classList.remove('es-victoria');
      premio.style.display = 'none';
    }

    pintarSaldo();
    overlayFinal.classList.remove('oculto');
  }

  function pintarSaldo() {
    Cartas.pintarIndicador(saldoFinal);
    btnReintentar.disabled = !Cartas.puedeJugarMemorama();
  }

  btnReintentar.addEventListener('click', function () {
    if (!Cartas.puedeJugarMemorama()) return;
    window.location.reload();
  });

  function sinCartas() {
    clearInterval(intervaloCuenta);
    overlayCuenta.classList.add('oculto');

    tituloFinal.textContent = 'Te faltan cartas';
    textoFinal.textContent  = 'Necesitas ' + Cartas.COSTO_MEMORAMA + ' cartas repetidas para jugar.';
    overlayFinal.classList.remove('es-victoria');
    premio.style.display = 'none';
    pintarSaldo();
    overlayFinal.classList.remove('oculto');
  }

  // Aquí se cobran las 2 repetidas, se gane o se pierda

  if (!Cartas.pagarMemorama()) {
    sinCartas();
    return;
  }

  construirTablero();
  arrancarCuenta();

})();
</script>

</body>
</html>
