<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Escanea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<!-- De aquí salen three.js y MindAR -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>

<div class="phone-shell">

  <div class="ar-screen">

    <!-- MindAR mete aquí la cámara y el 3D -->
    <div id="ar-container" class="ar-camera-container"></div>

    <a href="index.html" class="header-back" style="position:absolute; top:18px; left:18px; color:#151420;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
      Inicio
    </a>

    <div class="ar-arriba">
      <h1 class="ar-title">¡Escanea!</h1>
      <!-- Aparece al escanear una mascota -->
      <a href="#" class="ar-equipo-btn" id="btnEquipo" hidden>
        <img src="imagenes/equipo.png" alt="">
        Ver equipo
      </a>
    </div>

    <!-- Aquí se dibuja el confeti -->
    <canvas id="confetiCanvas" class="confeti-canvas"></canvas>

    <div class="ar-actions">
      <div class="ar-action-group">
        <button class="ar-action-btn" id="btnBailar" aria-label="Animación de baile">
          <img src="imagenes/bailar.png" alt="Bailar" class="accionARbailar">
        </button>
      </div>
      <div class="ar-action-group">
        <button class="ar-action-btn" id="btnConfeti" aria-label="Lanzar confeti">
          <svg class="accionARconfeti" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="3"  y="4"  width="4" height="4" rx="1" transform="rotate(-20 5 6)"/>
            <rect x="16" y="3"  width="4" height="4" rx="1" transform="rotate(25 18 5)"/>
            <rect x="18" y="12" width="4" height="4" rx="1" transform="rotate(-15 20 14)"/>
            <rect x="3"  y="14" width="4" height="4" rx="1" transform="rotate(30 5 16)"/>
            <rect x="10" y="9"  width="4" height="4" rx="1" transform="rotate(10 12 11)"/>
            <rect x="9"  y="18" width="4" height="4" rx="1" transform="rotate(-25 11 20)"/>
          </svg>
        </button>
      </div>
      <div class="ar-action-group">
        <button class="ar-action-btn" id="btnSaludar" aria-label="Animación de saludo">
          <img src="imagenes/saludar.png" alt="Saludar" class="accionARsaludar">
        </button>
      </div>
    </div>

  </div>

</div>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MindARThree } from 'mindar-image-three';

  // Mismo orden que las imágenes de targets.mind
  const MASCOTAS = [
    { nombre: 'Perro Sultán',     modelo: 'Modelos3D/PerroSultan/PerroSultanGLB.glb',         tamano: 1, giroY: 0, pararDePie: Math.PI / 2,
      equipo: 'equipos/sultanes/equipo.html',    nombreEquipo: 'Sultanes de Monterrey' },
    { nombre: 'Toro Torín',       modelo: 'Modelos3D/ToroTorin/ToroTorinGLB.glb',             tamano: 1, giroY: 0, pararDePie: Math.PI / 2,
      equipo: 'equipos/toros/equipo.html',       nombreEquipo: 'Toros de Tijuana' },
    { nombre: 'Pollo Algodonero', modelo: 'Modelos3D/PolloAlgodonero/PolloAlgodoneroGLB.glb', tamano: 1, giroY: 0, pararDePie: Math.PI / 2,
      equipo: 'equipos/algodoneros/equipo.html', nombreEquipo: 'Algodoneros de Unión Laguna' },
    { nombre: 'Tico el Teco',     modelo: 'Modelos3D/TicoElTeco/TicoElTecoGLB.glb',           tamano: 1, giroY: 0, pararDePie: Math.PI / 2,
      equipo: 'equipos/tecolotes/equipo.html',   nombreEquipo: 'Tecolotes de los Dos Laredos' },
  ];

  // Nombres que puede tener cada animación en los modelos
  const NOMBRES_ANIMACION = {
    idle:    ['idle', 'reposo'],
    bailar:  ['bailar', 'baile', 'bailando', 'dance', 'dancing'],
    saludar: ['saludar', 'saludo', 'saludando', 'wave', 'waving'],
  };

  function tipoDeAnimacion(nombre) {
    const limpio = nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    for (const tipo in NOMBRES_ANIMACION) {
      if (NOMBRES_ANIMACION[tipo].includes(limpio)) return tipo;
    }
    return null;
  }

  const mindarThree = new MindARThree({
    container: document.querySelector("#ar-container"),
    imageTargetSrc: "targets/targets.mind",
    uiScanning: "no",
    uiLoading: "no",
    uiError: "no",
    // Suavizado para que la mascota no tiemble
    filterMinCF: 0.0005,
    filterBeta: 0.001,
    // Cuadros que aguanta sin ver la imagen antes de esconder la mascota
    missTolerance: 10,
  });

  const { renderer, scene, camera } = mindarThree;

  // Sin luces el modelo se vería negro
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(0.5, 1, 0.7);
  scene.add(dirLight);

  const titulo = document.querySelector('.ar-title');
  const TITULO_INICIAL = titulo.textContent;

  const btnEquipo = document.getElementById('btnEquipo');
  function pintarBotonEquipo() {
    if (visible && visible.estado !== 'error') {
      btnEquipo.href = visible.equipo;
      btnEquipo.setAttribute('aria-label', 'Ver la página de los ' + visible.nombreEquipo);
      btnEquipo.hidden = false;
    } else {
      btnEquipo.hidden = true;
    }
  }

  const gltfLoader = new GLTFLoader();
  const reloj = new THREE.Clock();
  let visible = null;    // la mascota que se ve ahora

  // Así el título no regresa a ¡Escanea! al cambiar rápido de imagen
  const enPantalla = [];

  function actualizarVisible() {
    visible = enPantalla.length ? enPantalla[enPantalla.length - 1] : null;
    titulo.textContent = (visible && visible.estado !== 'error') ? visible.nombre : TITULO_INICIAL;
    pintarBotones();
    pintarBotonEquipo();
  }

  // Cada ancla sigue a una imagen del .mind
  MASCOTAS.forEach((mascota, indice) => {
    mascota.anchor = mindarThree.addAnchor(indice);
    mascota.estado = 'sin-cargar';     // sin-cargar, cargando, lista o error
    mascota.mixer = null;
    mascota.acciones = {};
    mascota.accionActual = null;
    mascota.animacionActiva = null;

    // La cámara encontró la imagen
    mascota.anchor.onTargetFound = () => {
      quitarDeLaLista(mascota);
      enPantalla.push(mascota);
      cargarMascota(mascota);
      actualizarVisible();
    };

    // La imagen salió de la cámara
    mascota.anchor.onTargetLost = () => {
      quitarDeLaLista(mascota);
      actualizarVisible();
    };
  });

  function quitarDeLaLista(mascota) {
    const i = enPantalla.indexOf(mascota);
    if (i !== -1) enPantalla.splice(i, 1);
  }

  // Cada modelo se baja hasta que se escanea, para no gastar datos
  function cargarMascota(mascota) {
    if (mascota.estado !== 'sin-cargar') return;
    mascota.estado = 'cargando';

    gltfLoader.load(
      mascota.modelo,
      (gltf) => {
        const modelo = gltf.scene;
        console.log('[BéisbAR] ' + mascota.nombre + ' cargado ✅');
        console.log('[BéisbAR] Animaciones encontradas:', gltf.animations.map(a => a.name));

        mascota.mixer = new THREE.AnimationMixer(modelo);

        gltf.animations.forEach((clip) => {
          const tipo = tipoDeAnimacion(clip.name);
          if (!tipo || mascota.acciones[tipo]) return;   // si no se reconoce, se ignora

          const accion = mascota.mixer.clipAction(clip);
          mascota.acciones[tipo] = accion;

          if (tipo === 'idle') {
            accion.loop = THREE.LoopRepeat;
          } else {
            accion.loop = THREE.LoopOnce;
            accion.clampWhenFinished = true;
          }
        });

        // Empieza en idle
        if (mascota.acciones['idle']) {
          mascota.accionActual = mascota.acciones['idle'];
          mascota.accionActual.play();
          mascota.mixer.update(0);
        }

        // Hay que acomodar el esqueleto antes de medir, si no sale gigante
        modelo.updateMatrixWorld(true);
        modelo.traverse((parte) => {
          if (parte.isSkinnedMesh) {
            parte.skeleton.update();
            parte.computeBoundingBox();
          }
        });

        const caja = new THREE.Box3().setFromObject(modelo);
        const tamano = new THREE.Vector3();
        const centro = new THREE.Vector3();
        caja.getSize(tamano);
        caja.getCenter(centro);

        const escala = mascota.tamano / Math.max(tamano.x, tamano.y, tamano.z);
        modelo.scale.setScalar(escala);

        // Centrada y parada sobre la imagen
        modelo.position.set(
          -centro.x * escala,
          -caja.min.y * escala,
          -centro.z * escala
        );

        const soporte = new THREE.Group();
        soporte.rotation.x = mascota.pararDePie;
        soporte.rotation.y = mascota.giroY;
        soporte.add(modelo);
        mascota.anchor.group.add(soporte);

        // Al terminar de bailar o saludar regresa a idle
        mascota.mixer.addEventListener('finished', (e) => {
          if (!mascota.animacionActiva) return;
          if (e.action !== mascota.acciones[mascota.animacionActiva]) return;
          volverAIdle(mascota);
        });

        mascota.estado = 'lista';
      },
      undefined,
      (error) => {
        mascota.estado = 'error';
        console.error('[BéisbAR] No se pudo cargar ' + mascota.modelo + ':', error);
        if (visible === mascota) actualizarVisible();
      }
    );
  }

  cargarMascota(MASCOTAS[0]);

  // Botones de animación
  const botones = {
    bailar:  document.getElementById('btnBailar'),
    saludar: document.getElementById('btnSaludar'),
  };

  function cambiarA(mascota, nuevaAccion, duracion = 0.25) {
    if (!nuevaAccion || nuevaAccion === mascota.accionActual) return;

    nuevaAccion.reset();
    nuevaAccion.setEffectiveTimeScale(1);
    nuevaAccion.setEffectiveWeight(1);
    nuevaAccion.play();

    if (mascota.accionActual) mascota.accionActual.crossFadeTo(nuevaAccion, duracion, false);
    mascota.accionActual = nuevaAccion;
  }

  function volverAIdle(mascota) {
    mascota.animacionActiva = null;
    cambiarA(mascota, mascota.acciones['idle'], 0.3);
    pintarBotones();
  }

  function pintarBotones() {
    const activa = visible ? visible.animacionActiva : null;
    for (const nombre in botones) {
      if (!botones[nombre]) continue;
      botones[nombre].classList.toggle('is-activo', activa === nombre);
    }
  }

  function alPresionar(nombre) {
    const mascota = visible;
    if (!mascota || !mascota.mixer || !mascota.acciones[nombre]) return;

    if (mascota.animacionActiva === nombre) {
      // Mismo botón otra vez: se cancela
      volverAIdle(mascota);
    } else {
      mascota.animacionActiva = nombre;
      cambiarA(mascota, mascota.acciones[nombre], 0.2);
      pintarBotones();
    }
  }

  botones.bailar.addEventListener('click',  () => alPresionar('bailar'));
  botones.saludar.addEventListener('click', () => alPresionar('saludar'));

  // Prender la cámara
  await mindarThree.start();
  console.log('[BéisbAR] Cámara y escaneo iniciados ✅ — buscando imágenes...');

  renderer.setAnimationLoop(() => {
    const dt = reloj.getDelta();
    // Solo se anima la mascota que se ve
    if (visible && visible.mixer) visible.mixer.update(dt);
    renderer.render(scene, camera);
  });
</script>

<!-- Confeti -->
<script>
(function () {
  var canvas = document.getElementById('confetiCanvas');
  var ctx    = canvas.getContext('2d');
  var boton  = document.getElementById('btnConfeti');

  var rutas = [];
  for (var i = 1; i <= 12; i++) {
    rutas.push('Particulas/PartículasConfeti' + i + '.png');
  }
  var imagenes = rutas.map(function (ruta) {
    var img = new Image();
    img.src = ruta;
    return img;
  });

  // Ajustes del confeti
  var POR_DISPARO   = 45;    // partículas por clic
  var MAX_TOTAL     = 700;
  var GRAVEDAD      = 900;
  var VIDA_MINIMA   = 2.8;
  var VIDA_EXTRA    = 1.4;

  var particulas = [];
  var animando   = false;
  var ultimoTiempo = 0;
  var anchoCSS = 0, altoCSS = 0;

  // Resolución real de la pantalla para que no se vea borroso
  function ajustarTamano() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    anchoCSS = rect.width;
    altoCSS  = rect.height;
    canvas.width  = Math.round(anchoCSS * dpr);
    canvas.height = Math.round(altoCSS  * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', ajustarTamano);
  window.addEventListener('orientationchange', ajustarTamano);
  ajustarTamano();

  // Sale de dos cañones, uno de cada lado
  function lanzarConfeti() {
    ajustarTamano();

    for (var i = 0; i < POR_DISPARO; i++) {
      var desdeIzquierda = (i % 2 === 0);

      var angulo = desdeIzquierda
        ? (-Math.PI / 3)     + (Math.random() * 0.5 - 0.25)
        : (-Math.PI * 2 / 3) + (Math.random() * 0.5 - 0.25);

      var velocidad = 700 + Math.random() * 500;

      particulas.push({
        x: desdeIzquierda ? -10 : anchoCSS + 10,
        y: altoCSS * (0.85 + Math.random() * 0.1),
        vx: Math.cos(angulo) * velocidad,
        vy: Math.sin(angulo) * velocidad,
        rot: Math.random() * Math.PI * 2,
        velRot: (Math.random() - 0.5) * 8,
        giro: Math.random() * Math.PI * 2,
        velGiro: 4 + Math.random() * 4,
        tam: 10 + Math.random() * 14,
        img: imagenes[Math.floor(Math.random() * imagenes.length)],
        vida: 0,
        vidaMax: VIDA_MINIMA + Math.random() * VIDA_EXTRA
      });
    }

    if (particulas.length > MAX_TOTAL) {
      particulas.splice(0, particulas.length - MAX_TOTAL);
    }

    if (!animando) {
      animando = true;
      ultimoTiempo = performance.now();
      requestAnimationFrame(bucle);
    }
  }

  function bucle(ahora) {
    var dt = (ahora - ultimoTiempo) / 1000;
    ultimoTiempo = ahora;
    if (dt > 0.05) dt = 0.05;   // por si el celular se traba

    ctx.clearRect(0, 0, anchoCSS, altoCSS);

    for (var i = particulas.length - 1; i >= 0; i--) {
      var p = particulas[i];

      p.vida += dt;
      if (p.vida >= p.vidaMax) {
        particulas.splice(i, 1);
        continue;
      }

      // Resistencia del aire y gravedad
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + GRAVEDAD * dt;
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;
      p.rot  += p.velRot * dt;
      p.giro += p.velGiro * dt;

      // Se desvanece al final
      var restante = 1 - (p.vida / p.vidaMax);
      var alpha = restante < 0.3 ? (restante / 0.3) : 1;

      if (!p.img.complete) continue;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      // Aplastarlo simula que el papel se voltea
      ctx.scale(Math.max(Math.abs(Math.cos(p.giro)), 0.15), 1);
      ctx.drawImage(p.img, -p.tam / 2, -p.tam / 2, p.tam, p.tam);
      ctx.restore();
    }

    if (particulas.length > 0) {
      requestAnimationFrame(bucle);
    } else {
      ctx.clearRect(0, 0, anchoCSS, altoCSS);
      animando = false;
    }
  }

  boton.addEventListener('click', lanzarConfeti);

})();
</script>

</body>
</html>
