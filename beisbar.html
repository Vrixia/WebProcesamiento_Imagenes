<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Escanea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<!-- Mapa de importaciones: le dice al navegador de dónde bajar three.js, sus addons (OBJLoader) y MindAR -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>

<div class="phone-shell">

  <div class="ar-screen">

    <!-- Aquí MindAR va a inyectar automáticamente el <video> de la cámara y el <canvas> 3D -->
    <div id="ar-container" class="ar-camera-container"></div>

    <a href="index.html" class="header-back" style="position:absolute; top:18px; left:18px; color:#151420;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
      Inicio
    </a>

    <h1 class="ar-title">¡Escanea!</h1>

    <!-- Capa donde se dibuja el confeti. No bloquea clicks (pointer-events:none en el CSS) -->
    <canvas id="confetiCanvas" class="confeti-canvas"></canvas>

    <div class="ar-actions">
      <div class="ar-action-group">
        <button class="ar-action-btn" id="btnBailar" aria-label="Animación de baile">
          <img src="imagenes/bailar.png" alt="Bailar" class="accionARbailar">
        </button>
      </div>
      <div class="ar-action-group">
        <button class="ar-action-btn" id="btnConfeti" aria-label="Lanzar confeti">
          <svg class="accionARconfeti" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="3"  y="4"  width="4" height="4" rx="1" transform="rotate(-20 5 6)"/>
            <rect x="16" y="3"  width="4" height="4" rx="1" transform="rotate(25 18 5)"/>
            <rect x="18" y="12" width="4" height="4" rx="1" transform="rotate(-15 20 14)"/>
            <rect x="3"  y="14" width="4" height="4" rx="1" transform="rotate(30 5 16)"/>
            <rect x="10" y="9"  width="4" height="4" rx="1" transform="rotate(10 12 11)"/>
            <rect x="9"  y="18" width="4" height="4" rx="1" transform="rotate(-25 11 20)"/>
          </svg>
        </button>
      </div>
      <div class="ar-action-group">
        <button class="ar-action-btn" id="btnSaludar" aria-label="Animación de saludo">
          <img src="imagenes/saludar.png" alt="Saludar" class="accionARsaludar">
        </button>
      </div>
    </div>

  </div>

</div>

<script type="module">
  import * as THREE from 'three';
  import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
  import { MindARThree } from 'mindar-image-three';

  // -----------------------------------------------------------------
  // 1) Arrancar MindAR apuntando al archivo .mind ya compilado
  //    (el logo de Sultanes). Ver nota al final sobre cómo generarlo.
  // -----------------------------------------------------------------
  const mindarThree = new MindARThree({
    container: document.querySelector("#ar-container"),
    imageTargetSrc: "targets/targets.mind",
    uiScanning: "no",
    uiLoading: "no",
    uiError: "no",
  });

  const { renderer, scene, camera } = mindarThree;

  // Luces: necesarias porque el material del modelo reacciona a la luz
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(0.5, 1, 0.7);
  scene.add(dirLight);

  // -----------------------------------------------------------------
  // 2) Anclar el contenido al target índice 0 (el único logo por ahora)
  // -----------------------------------------------------------------
  const anchor = mindarThree.addAnchor(0);

  // Grupo que vamos a mover/animar al presionar los botones
  const perroGrupo = new THREE.Group();
  anchor.group.add(perroGrupo);

  // -----------------------------------------------------------------
  // 3) Cargar el modelo OBJ + sus 3 texturas y armar el material
  // -----------------------------------------------------------------
  const textureLoader = new THREE.TextureLoader();

  const mapaColor = textureLoader.load('Modelos3D/PerroSultan/Texturas/Perro_Sultan_Albedo.png');
  mapaColor.colorSpace = THREE.SRGBColorSpace;
  const mapaNormal = textureLoader.load('Modelos3D/PerroSultan/Texturas/Perro_Sultan_Normal.png');
  const mapaRugosidad = textureLoader.load('Modelos3D/PerroSultan/Texturas/Perro_Sultan_Roughness.png');

  const material = new THREE.MeshStandardMaterial({
    map: mapaColor,
    normalMap: mapaNormal,
    roughnessMap: mapaRugosidad,
  });

  const objLoader = new OBJLoader();
  objLoader.load(
    'Modelos3D/PerroSultan/PerroSultanOBJ.obj',
    (objeto) => {
      objeto.traverse((hijo) => {
        if (hijo.isMesh) hijo.material = material;
      });

      // --- Orientación del modelo sobre el logo ---
      objeto.scale.set(0.18, 0.18, 0.18);   // tamaño relativo al logo (1 unidad = ancho del logo)
      objeto.position.set(0, 0, 0);       // centrado sobre el logo
      objeto.rotation.x = Math.PI / 2;   // lo para de pie (no tocar)
      objeto.rotation.z = 0;             //esto lo estaba acostando
      objeto.rotation.y = Math.PI/2;             //este es el que gira hacia dónde mira
      perroGrupo.add(objeto);
    },
    undefined,
    (error) => console.error('No se pudo cargar el modelo OBJ:', error)
  );

  // -----------------------------------------------------------------
  // 4) Animaciones simples de "bailar" y "saludar"
  //    (el OBJ no trae animaciones internas, así que las simulamos
  //    moviendo el objeto por código durante unos segundos).
  // -----------------------------------------------------------------
  let animacionActiva = null;   // 'bailar' | 'saludar' | null
  let animacionInicio = 0;

  document.getElementById('btnBailar').addEventListener('click', () => {
    animacionActiva = 'bailar';
    animacionInicio = performance.now();
  });
  document.getElementById('btnSaludar').addEventListener('click', () => {
    animacionActiva = 'saludar';
    animacionInicio = performance.now();
  });

  function actualizarAnimacion() {
    if (!animacionActiva) return;
    const transcurrido = (performance.now() - animacionInicio) / 1000; // segundos

    if (animacionActiva === 'bailar') {
      const duracion = 2.2;
      if (transcurrido > duracion) { animacionActiva = null; perroGrupo.rotation.z = 0; perroGrupo.position.y = 0; return; }
      perroGrupo.rotation.z = Math.sin(transcurrido * 10) * 0.25;
      perroGrupo.position.y = Math.abs(Math.sin(transcurrido * 10)) * 0.08;
    }

    if (animacionActiva === 'saludar') {
      const duracion = 1.6;
      if (transcurrido > duracion) { animacionActiva = null; perroGrupo.rotation.y = 0; return; }
      perroGrupo.rotation.y = Math.sin(transcurrido * 8) * 0.35;
    }
  }

  // -----------------------------------------------------------------
  // 5) Iniciar cámara + escaneo automático (no requiere botón)
  // -----------------------------------------------------------------
  await mindarThree.start();

  renderer.setAnimationLoop(() => {
    actualizarAnimacion();
    renderer.render(scene, camera);
  });
</script>

<!-- ===================================================================
     CONFETI: sistema de partículas dibujado en su propio <canvas> 2D.
     Es independiente de MindAR/Three.js, así que funciona esté o no
     detectado el logo.
     =================================================================== -->
<script>
(function () {

  var canvas = document.getElementById('confetiCanvas');
  var ctx    = canvas.getContext('2d');
  var boton  = document.getElementById('btnConfeti');

  // --- Las 12 imágenes de confeti ---
  var rutas = [];
  for (var i = 1; i <= 12; i++) {
    rutas.push('Particulas/PartículasConfeti' + i + '.png');
  }
  var imagenes = rutas.map(function (ruta) {
    var img = new Image();
    img.src = ruta;
    return img;
  });

  // --- Ajustes que puedes cambiar a gusto ---
  var POR_DISPARO   = 45;    // cuántas partículas salen por cada click
  var MAX_TOTAL     = 700;   // tope para que no se sature si lo pican mucho
  var GRAVEDAD      = 900;   // qué tan rápido caen
  var VIDA_MINIMA   = 2.8;   // segundos que dura una partícula (mínimo)
  var VIDA_EXTRA    = 1.4;   // segundos extra aleatorios

  var particulas = [];
  var animando   = false;
  var ultimoTiempo = 0;
  var anchoCSS = 0, altoCSS = 0;

  // -----------------------------------------------------------------
  // Ajustar el canvas al tamaño real de la pantalla (y a la densidad
  // de píxeles del celular, para que no se vea borroso)
  // -----------------------------------------------------------------
  function ajustarTamano() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    anchoCSS = rect.width;
    altoCSS  = rect.height;
    canvas.width  = Math.round(anchoCSS * dpr);
    canvas.height = Math.round(altoCSS  * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', ajustarTamano);
  window.addEventListener('orientationchange', ajustarTamano);
  ajustarTamano();

  // -----------------------------------------------------------------
  // Lanzar una tanda de confeti (dos "cañones", desde abajo a los lados)
  // -----------------------------------------------------------------
  function lanzarConfeti() {
    ajustarTamano();

    for (var i = 0; i < POR_DISPARO; i++) {
      var desdeIzquierda = (i % 2 === 0);

      // Ángulo de salida: hacia arriba y en diagonal al centro
      var angulo = desdeIzquierda
        ? (-Math.PI / 3)     + (Math.random() * 0.5 - 0.25)
        : (-Math.PI * 2 / 3) + (Math.random() * 0.5 - 0.25);

      var velocidad = 700 + Math.random() * 500;

      particulas.push({
        x: desdeIzquierda ? -10 : anchoCSS + 10,
        y: altoCSS * (0.85 + Math.random() * 0.1),
        vx: Math.cos(angulo) * velocidad,
        vy: Math.sin(angulo) * velocidad,
        rot: Math.random() * Math.PI * 2,          // rotación inicial
        velRot: (Math.random() - 0.5) * 8,          // qué tan rápido gira
        giro: Math.random() * Math.PI * 2,          // para el "aleteo"
        velGiro: 4 + Math.random() * 4,
        tam: 10 + Math.random() * 14,               // escala distinta por partícula
        img: imagenes[Math.floor(Math.random() * imagenes.length)],
        vida: 0,
        vidaMax: VIDA_MINIMA + Math.random() * VIDA_EXTRA
      });
    }

    // Si se acumularon demasiadas, se quitan las más viejas
    if (particulas.length > MAX_TOTAL) {
      particulas.splice(0, particulas.length - MAX_TOTAL);
    }

    // Arrancar el bucle solo si no estaba corriendo ya
    if (!animando) {
      animando = true;
      ultimoTiempo = performance.now();
      requestAnimationFrame(bucle);
    }
  }

  // -----------------------------------------------------------------
  // Bucle de animación
  // -----------------------------------------------------------------
  function bucle(ahora) {
    var dt = (ahora - ultimoTiempo) / 1000;
    ultimoTiempo = ahora;
    if (dt > 0.05) dt = 0.05;   // evita saltos si el celular se traba un momento

    ctx.clearRect(0, 0, anchoCSS, altoCSS);

    for (var i = particulas.length - 1; i >= 0; i--) {
      var p = particulas[i];

      p.vida += dt;
      if (p.vida >= p.vidaMax) {
        particulas.splice(i, 1);
        continue;
      }

      // Física: resistencia del aire + gravedad
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + GRAVEDAD * dt;
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;
      p.rot  += p.velRot * dt;
      p.giro += p.velGiro * dt;

      // Se desvanece en el último 30% de su vida
      var restante = 1 - (p.vida / p.vidaMax);
      var alpha = restante < 0.3 ? (restante / 0.3) : 1;

      if (!p.img.complete) continue;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      // Aplastar horizontalmente simula que el papelito se voltea en el aire
      ctx.scale(Math.max(Math.abs(Math.cos(p.giro)), 0.15), 1);
      ctx.drawImage(p.img, -p.tam / 2, -p.tam / 2, p.tam, p.tam);
      ctx.restore();
    }

    if (particulas.length > 0) {
      requestAnimationFrame(bucle);
    } else {
      // Ya no queda nada: limpiar y detener el bucle (ahorra batería)
      ctx.clearRect(0, 0, anchoCSS, altoCSS);
      animando = false;
    }
  }

  boton.addEventListener('click', lanzarConfeti);

})();
</script>

</body>
</html>
