<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Memorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/animaciones.js"></script>
</head>
<body>

<div class="phone-shell">

  <header class="app-header">
      <div class="imgheader">
        <a href="index.html" aria-label="Ir al inicio"><img src="imagenes/LogoBeisbARLetrasrz.png" alt="BéisbAR MX"></a>
      </div>
  </header>

  <main class="app-main" style="background:linear-gradient(180deg, #ff8fae 0%, #9f2f4e 90%); margin:0; padding:34px 20px;">
    <div class="memorama-intro">
      <img src="imagenes/textomemorama.png" class="memorama-title">

      <div class="memorama-icon">
        <img src="imagenes/memorama.png">
      </div>

      <a href="memorama-juego.html" class="memorama-cta" id="btnEntrar">Ingresa 2 tarjetas</a>

      <div class="memorama-stake">
       <img src="imagenes/cartas2.png">
       <span id="cuantasTengo">Tienes 0</span>
      </div>

      <p class="memorama-note" id="nota">¡Supera el reto y gana una nueva carta!</p>
    </div>
  </main>

  <footer class="footer-bar">
    <a href="index.html">Inicio</a>
  </footer>

</div>

<script src="js/cartas.js"></script>
<script>
  (function () {

    var etiqueta = document.getElementById('cuantasTengo');
    var boton    = document.getElementById('btnEntrar');
    var nota     = document.getElementById('nota');

    function pintar() {
      var tengo  = Cartas.repetidas();
      var cuesta = Cartas.COSTO_MEMORAMA;

      etiqueta.textContent = 'Tienes ' + tengo;

      if (tengo >= cuesta) {
        // Alcanza: el botón funciona normal
        boton.classList.remove('esta-apagada');
        boton.removeAttribute('aria-disabled');
        nota.textContent = '¡Supera el reto y gana una nueva carta!';
      } else {
        // No alcanza: se apaga el botón y se explica cómo conseguir más
        boton.classList.add('esta-apagada');
        boton.setAttribute('aria-disabled', 'true');
        nota.textContent = 'Necesitas ' + cuesta + ' cartas repetidas para entrar. ' +
          'Se ganan en la trivia, cuando la carta que te toca ya la tenías.';
      }
    }

    // Si el botón está apagado, no deja pasar
    boton.addEventListener('click', function (evento) {
      if (boton.classList.contains('esta-apagada')) {
        evento.preventDefault();
      }
    });

    pintar();
    // pageshow (y no solo load) para que el contador se actualice también
    // cuando el usuario regresa con el botón "atrás" del navegador
    window.addEventListener('pageshow', pintar);
  })();
</script>

</body>
</html>
