<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="phone-shell">

  <header class="app-header header--navy">
      <div class="imgheader">
        <img src="imagenes/LogoBeisbARLetrasrz.png">
      </div>
  </header>

  <main class="app-main">

    <div style="text-align:center; margin-bottom:20px;">
      <span class="pill-btn" style="font-size:1.3rem; padding:12px 34px;">Trivia</span>
    </div>

    <!-- 5 preguntas aleatorias de un banco de 20. Se muestran 3 como ejemplo de estructura. -->
    <div class="trivia-question">
      <p>1.- ¿En qué año se jugó el primer partido oficial de la Liga Mexicana de Beisbol?</p>
      <div class="trivia-answers">
        <label><input type="radio" name="q1"> Respuesta 1</label>
        <label><input type="radio" name="q1"> Respuesta 2</label>
        <label><input type="radio" name="q1"> Respuesta 3</label>
        <label><input type="radio" name="q1"> Respuesta 4</label>
      </div>
    </div>

    <div class="trivia-question">
      <p>2.- ¿Cuál es la mascota de los Sultanes de Monterrey?</p>
      <!-- IMAGEN opcional de apoyo para la pregunta -->
      <div class="img-placeholder trivia-media">Imagen de apoyo</div>
      <div class="trivia-answers">
        <label><input type="radio" name="q2"> Respuesta 1</label>
        <label><input type="radio" name="q2"> Respuesta 2</label>
        <label><input type="radio" name="q2"> Respuesta 3</label>
        <label><input type="radio" name="q2"> Respuesta 4</label>
      </div>
    </div>

    <div class="trivia-question">
      <p>3.- ¿En qué estadio juegan los Toros de Tijuana?</p>
      <div class="trivia-answers">
        <label><input type="radio" name="q3"> Respuesta 1</label>
        <label><input type="radio" name="q3"> Respuesta 2</label>
        <label><input type="radio" name="q3"> Respuesta 3</label>
        <label><input type="radio" name="q3"> Respuesta 4</label>
      </div>
    </div>
    
    <div style="text-align:center; margin-top:24px;">
        <button type="button" class="btn-submit">Enviar</button>
    </div>


  </main>

  <footer class="footer-bar">
    <a href="index.html">Inicio</a>
  </footer>

</div>

</body>
</html>
