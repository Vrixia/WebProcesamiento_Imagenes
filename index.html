<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/animaciones.js"></script>
<script>
  // Si ya vio el splash, entra directo al menú
  try {
    if (sessionStorage.getItem('beisbarSplashVisto') === 'si') {
      document.documentElement.className += ' sin-splash';
    }
  } catch (e) {}
</script>
</head>
<body>

<div class="phone-shell">

  <!-- Splash -->
  <div class="splash splash-screen" id="splashScreen">
    <div class="splash-logo-box">
      <img src="imagenes/LogoBeisbAR.png">
    </div>

    <div class="splash-logo">
      <img src="imagenes/LogoBeisbARLetrasrz.png" alt="BéisbAR MX">
    </div>
    <p class="splash-tap">Pica en cualquier lugar para continuar</p>
  </div>

  <!-- Menú principal -->
  <div class="menu-screen" id="menuScreen">

    <header class="app-header header--navy">
      <div class="imgheader">
        <a href="index.html" aria-label="Ir al inicio"><img src="imagenes/LogoBeisbARLetrasrz.png" alt="BéisbAR MX"></a>
      </div>
      
    </header>

    <main class="app-main" style="position:relative;">

      <div class="menu-top-row">
        <a href="trivia.html" class="pill-btn" style="flex:1;">
          Trivia
        </a>
        <a href="coleccion.html" class="icon-btn" aria-label="Colección de cartas">
          <img src="imagenes/cartas.png">
        </a>
      </div>

      <hr class="linea-punteada">

      <div class="opcionesmenuprincipal">
        <a href="historia.html" class="boton-imagen">
          <img src="imagenes/imghistoria2.png" alt="Historia">
        </a>

        <a href="equipos/sultanes/equipo.html" class="boton-imagen">
          <img src="imagenes/imgsultanes.png" alt="Sultanes">
        </a>

        <a href="equipos/toros/equipo.html" class="boton-imagen">
          <img src="imagenes/imgtoros.png" alt="Toros">
        </a>

        <a href="equipos/algodoneros/equipo.html" class="boton-imagen">
          <img src="imagenes/imgalgodoneros.png" alt="Algodoneros">
        </a>

        <a href="equipos/tecolotes/equipo.html" class="boton-imagen">
          <img src="imagenes/imgtecolotes.png" alt="Tecolotes">
        </a>
      </div>

      <hr class="linea-punteada">
      <div class="boton-beisbar">
        <span class="boton-beisbar-titulo">BéisbAR</span>

        <a href="beisbar.html" class="boton-beisbar-scanner">
          <img src="imagenes/scanner.png" alt="Escáner BéisbAR">
        </a>
      </div>

    </main>

    <!-- Fuera del contenido para que se quede fijo -->
    <a href="ayuda.html" class="ayuda-fab" aria-label="Ayuda">
      <img src="imagenes/ayuda.png" alt="Ayuda">
    </a>
  </div>

</div>

<script>
// El splash sale una vez por sesión (sessionStorage se borra al cerrar la pestaña)
(function () {
  var CLAVE  = 'beisbarSplashVisto';
  var splash = document.getElementById('splashScreen');
  var menu   = document.getElementById('menuScreen');

  // En incógnito puede fallar
  function yaLoVio() {
    try { return sessionStorage.getItem(CLAVE) === 'si'; }
    catch (e) { return false; }
  }
  function recordar() {
    try { sessionStorage.setItem(CLAVE, 'si'); } catch (e) {}
  }

  function mostrarMenu() {
    if (splash.classList.contains('saliendo')) return;
    recordar();

    var reducir = window.matchMedia &&
                  window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducir) {
      cambiarAlMenu();
    } else {
      splash.classList.add('saliendo');
      setTimeout(cambiarAlMenu, 330);   // lo que dura la animación
    }
  }

  function cambiarAlMenu() {
    splash.classList.add('is-hidden');
    menu.classList.add('is-visible');
  }

  if (yaLoVio()) {
    splash.classList.add('is-hidden');
    menu.classList.add('is-visible');
  } else {
    splash.addEventListener('click', mostrarMenu);
  }

})();
</script>

</body>
</html>
