<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Videos de Algodoneros de Unión Laguna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/styles.css">
<script src="../../js/animaciones.js"></script>
</head>
<body class="team-algodoneros">

<div class="phone-shell">

  <header class="app-header header--team">
      <div class="imgheader">
        <a href="../../index.html" aria-label="Ir al inicio"><img src="../../imagenes/LogoBeisbARLetrasrz.png" alt="BéisbAR MX"></a>
      </div>
  </header>

  <main class="app-main">

    <h1 class="section-title">Videos</h1>

    <div class="video-card">
      <h3>La historia del Unión Laguna</h3>
      <div class="video-stage">
        <video src="../../videos/Historia_algodoneros-1.mp4" poster="../../imagenes/Videos/Historia_algodoneros-1.webp" controls playsinline preload="metadata"></video>
      </div>
      <div class="video-filters">
        <button type="button" data-filtro="deportivo" aria-label="Filtro deportivo"><img src="../../imagenes/bate.png" alt=""></button>
        <button type="button" data-filtro="borroso" aria-label="Filtro desenfoque"><img src="../../imagenes/borroso.png" alt=""></button>
        <button type="button" data-filtro="frio" aria-label="Filtro frío"><img src="../../imagenes/frio.png" alt=""></button>
        <button type="button" data-filtro="calido" aria-label="Filtro cálido"><img src="../../imagenes/calido.png" alt=""></button>
      </div>
    </div>

    <div class="video-card">
      <h3>El Estadio de la Revolución</h3>
      <div class="video-stage">
        <video src="../../videos/Estadio-revolucion.mp4" poster="../../imagenes/Videos/Estadio-revolucion.webp" controls playsinline preload="metadata"></video>
      </div>
      <div class="video-filters">
        <button type="button" data-filtro="deportivo" aria-label="Filtro deportivo"><img src="../../imagenes/bate.png" alt=""></button>
        <button type="button" data-filtro="borroso" aria-label="Filtro desenfoque"><img src="../../imagenes/borroso.png" alt=""></button>
        <button type="button" data-filtro="frio" aria-label="Filtro frío"><img src="../../imagenes/frio.png" alt=""></button>
        <button type="button" data-filtro="calido" aria-label="Filtro cálido"><img src="../../imagenes/calido.png" alt=""></button>
      </div>
    </div>

  </main>

    <nav class="bottom-nav">
      <a href="../../index.html"><span class="icon"><img src="../../imagenes/inicio.png" alt="Inicio"></span>Inicio</a>
      <a href="equipo.html"><span class="icon"><img src="../../imagenes/equipo.png" alt="Equipo"></span>Equipo</a>
      <a href="jugadores.html"><span class="icon"><img src="../../imagenes/jugadores.png" alt="Jugadores"></span>Jugadores</a>
      <a href="campeonatos.html"><span class="icon"><img src="../../imagenes/campeonatos.png" alt="Campeonatos"></span>Campeonatos</a>
      <a href="videos.html" class="is-active"><span class="icon"><img src="../../imagenes/videos.png" alt="Videos"></span>Videos</a>
    </nav>


</div>

<!-- reproductor.js va primero: arma los controles y el lienzo del video,
     y filtros.js pone sus capas de efectos dentro de ese lienzo. -->
<script src="../../js/reproductor.js"></script>
<script src="../../js/filtros.js"></script>

</body>
</html>
