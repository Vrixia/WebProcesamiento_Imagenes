<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BéisbAR MX — Mi colección</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/animaciones.js"></script>
</head>
<body>

<div class="phone-shell">

  <header class="app-header">
      <div class="imgheader">
        <a href="index.html" aria-label="Ir al inicio"><img src="imagenes/LogoBeisbARLetrasrz.png" alt="BéisbAR MX"></a>
      </div>
  </header>

  <main class="app-main" style="position:relative;">

    <div class="collection-topbar">
      <h1 class="section-title" style="margin:0;">Mi colección:</h1>
      <div class="count">
        <img src="imagenes/cartas2.png" width="25px" height="auto">
        <span id="contador">0 / 12</span>
      </div>
    </div>

    <!-- La cuadrícula se genera desde JavaScript -->
    <div class="card-grid" id="cuadricula"></div>

    <p class="coleccion-aviso" id="aviso"></p>

    <!-- Cartas repetidas: son las que se gastan para entrar al memorama -->
    <p class="coleccion-repetidas" id="repetidas"></p>

  </main>

  <!-- Botón del memorama. Cuelga de .phone-shell (no de .app-main) para que
       se quede fijo en pantalla mientras el contenido hace scroll. -->
  <a href="memorama.html" class="memorama-fab" aria-label="Entrar al memorama">
    <img src="imagenes/memorama.png">
  </a>

  <footer class="footer-bar">
    <a href="index.html">Inicio</a>
  </footer>

</div>

<script src="js/cartas.js"></script>
<script>
(function () {

  var cuadricula = document.getElementById('cuadricula');
  var contador   = document.getElementById('contador');
  var aviso      = document.getElementById('aviso');
  var repetidas  = document.getElementById('repetidas');

  function pintar() {
    cuadricula.innerHTML = '';

    Cartas.LISTA.forEach(function (carta) {
      var laTengo = Cartas.tiene(carta.id);

      if (laTengo) {
        // Carta desbloqueada, se ve y se puede abrir en 3D
        var enlace = document.createElement('a');
        enlace.className = 'card-slot is-unlocked';
        enlace.href = 'carta.html?id=' + encodeURIComponent(carta.id);
        enlace.setAttribute('aria-label', 'Ver ' + carta.nombre + ' en 3D');
        enlace.innerHTML = '<img src="' + Cartas.rutaThumb(carta.id) + '" alt="' + carta.nombre + '">';
        cuadricula.appendChild(enlace);

      } else {
        // Carta bloqueada
        var hueco = document.createElement('div');
        hueco.className = 'card-slot is-locked';
        hueco.setAttribute('aria-label', 'Carta bloqueada');
        hueco.innerHTML =
          '<img src="' + Cartas.rutaReverso() + '" alt="">' +
          '<span class="candado">🔒</span>';
        cuadricula.appendChild(hueco);
      }
    });

    var tengo = Cartas.contarDistintas();
    contador.textContent = tengo + ' / ' + Cartas.LISTA.length;

    if (tengo === 0) {
      aviso.textContent = 'Todavía no tienes cartas. Consigue de 8 a 10 aciertos en la trivia o gana el memorama para desbloquear la primera.';
    } else if (tengo === Cartas.LISTA.length) {
      aviso.textContent = '¡Completaste la colección! Tienes las 12 cartas.';
    } else {
      aviso.textContent = 'Te faltan ' + (Cartas.LISTA.length - tengo) + ' cartas por conseguir.';
    }

    var comodines = Cartas.repetidas();
    repetidas.textContent = 'Cartas repetidas: ' + comodines +
      ' · cada partida de memorama cuesta ' + Cartas.COSTO_MEMORAMA + '.';
  }

  pintar();

  // Al volver con el botón "atrás", el navegador puede mostrar la página
  // guardada en memoria (persisted): ahí sí se repinta, por si se ganaron cartas.
  window.addEventListener('pageshow', function (evento) {
    if (evento.persisted) pintar();
  });

})();
</script>

</body>
</html>
